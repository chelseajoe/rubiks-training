<script>
// ---------- Cube logic (no rendering) ----------
const FACES = {
  U: [0, 1, 0], D: [0, -1, 0], R: [1, 0, 0], L: [-1, 0, 0], F: [0, 0, 1], B: [0, 0, -1]
};
const AXIS_INDEX = { x: 0, y: 1, z: 2 };

// base move definitions: axis, layer coords, quarter turns (+1 = counter-clockwise by right-hand rule about +axis)
const BASE = {
  R: ['x', [1], -1], L: ['x', [-1], 1], M: ['x', [0], 1],
  U: ['y', [1], -1], D: ['y', [-1], 1], E: ['y', [0], 1],
  F: ['z', [1], -1], B: ['z', [-1], 1], S: ['z', [0], -1],
  r: ['x', [0, 1], -1], l: ['x', [-1, 0], 1],
  u: ['y', [0, 1], -1], d: ['y', [-1, 0], 1],
  f: ['z', [0, 1], -1], b: ['z', [-1, 0], 1],
  x: ['x', [-1, 0, 1], -1], y: ['y', [-1, 0, 1], -1], z: ['z', [-1, 0, 1], -1]
};

function normalizeAlgText(text) {
  return String(text)
    .replace(/[’‘`´′ʼ]/g, "'")
    .replace(/[·•]/g, ' ')
    .replace(/[()\[\],]/g, ' ')
    .replace(/\/\/.*$/gm, ' ');
}

// returns {moves:[{name, base, amount}], error}
function parseAlg(text) {
  const src = normalizeAlgText(text);
  const moves = [];
  const re = /([RLUDFBMESxyz]w|[RLUDFBMESxyzrludfb])(\d*)('?)(\d*)/y;
  let i = 0;
  while (i < src.length) {
    if (/\s/.test(src[i])) { i++; continue; }
    re.lastIndex = i;
    const m = re.exec(src);
    if (!m) {
      const bad = src.slice(i).split(/\s/)[0];
      return { moves, error: `“${bad}” isn’t a move I know` };
    }
    let face = m[1];
    if (face.length === 2) face = face[0].toLowerCase(); // Rw -> r
    const num = parseInt(m[2] || m[4] || '1', 10);
    if (!(num >= 1 && num <= 3)) return { moves, error: `“${m[0]}” has an odd turn count` };
    let amount = num * (m[3] ? -1 : 1);
    amount = ((amount % 4) + 4) % 4; // 1,2,3
    if (amount === 0) { i = re.lastIndex; continue; }
    // keep the move exactly as written (R3 stays R3, R2' stays R2') for display and animation
    moves.push({ base: face, amount, raw: m[0], q: num * (m[3] ? -1 : 1) });
    i = re.lastIndex;
  }
  return { moves, error: null };
}

function moveToString(mv) {
  if (mv.raw) return mv.raw;
  return mv.base + (mv.amount === 1 ? '' : mv.amount === 2 ? '2' : "'");
}
function invertRaw(raw) { return raw.endsWith("'") ? raw.slice(0, -1) : /2$/.test(raw) ? raw : raw + "'"; }
function movesToString(moves) { return moves.map(moveToString).join(' '); }
function invertMoves(moves) {
  return moves.slice().reverse().map(m => m.raw
    ? { base: m.base, amount: (4 - m.amount) % 4, raw: invertRaw(m.raw), q: -m.q }
    : { base: m.base, amount: (4 - m.amount) % 4 });
}
function invertAlg(text) {
  const p = parseAlg(text);
  return movesToString(invertMoves(p.moves));
}
// quarter turns signed for animation (-2..2)
function moveTurns(mv) {
  const sign = BASE[mv.base][2];
  if (mv.q) return sign * mv.q;   // as written: R3 is a real triple turn
  if (mv.amount === 1) return sign;
  if (mv.amount === 3) return -sign;
  return 2 * sign;
}

function rotVec(v, axis, q) {
  q = ((q % 4) + 4) % 4;
  let [x, y, z] = v;
  for (let k = 0; k < q; k++) {
    if (axis === 'x') [x, y, z] = [x, -z, y];
    else if (axis === 'y') [x, y, z] = [z, y, -x];
    else [x, y, z] = [-y, x, z];
  }
  return [x, y, z];
}

function solvedState() {
  const st = [];
  for (const f in FACES) {
    const n = FACES[f];
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
      let p;
      if (n[0]) p = [n[0], a, b];
      else if (n[1]) p = [a, n[1], b];
      else p = [a, b, n[2]];
      st.push({ p, n: n.slice(), c: f });
    }
  }
  return st;
}

function applyMove(st, mv) {
  const [axis, layers, sign] = BASE[mv.base];
  const ai = AXIS_INDEX[axis];
  const q = sign * mv.amount;
  for (const s of st) {
    if (layers.includes(s.p[ai])) {
      s.p = rotVec(s.p, axis, q);
      s.n = rotVec(s.n, axis, q);
    }
  }
  return st;
}
function applyMoves(st, moves) { for (const m of moves) applyMove(st, m); return st; }

const key = (p, n) => p.join(',') + '|' + n.join(',');

// color found at each physical (position, normal) slot, recoloured relative to the centres so
// whole-cube rotations don't matter. Returns map slotKey -> faceName it "should" be.
function relativeColors(st) {
  const centre = {};
  for (const s of st) {
    const isCentre = s.p.filter(v => v !== 0).length === 1;
    if (isCentre) centre[s.c] = faceOf(s.n);
  }
  const out = {};
  for (const s of st) out[key(s.p, s.n)] = centre[s.c];
  return out;
}
function faceOf(n) {
  for (const f in FACES) if (FACES[f].every((v, i) => v === n[i])) return f;
}
// state description in standard frame (centres at home): array of 54 face letters in fixed slot order
const SLOT_ORDER = solvedState().map(s => key(s.p, s.n));
function frameState(st) {
  // rotate so centres are home: find a rotation among 24 that puts U-centre up and F-centre front
  const rots = allRotations();
  for (const r of rots) {
    const t = st.map(s => ({ p: s.p.slice(), n: s.n.slice(), c: s.c }));
    applyMoves(t, r);
    let ok = true;
    for (const s of t) {
      const isCentre = s.p.filter(v => v !== 0).length === 1;
      if (isCentre && faceOf(s.n) !== s.c) { ok = false; break; }
    }
    if (ok) {
      const m = {};
      for (const s of t) m[key(s.p, s.n)] = s.c;
      return SLOT_ORDER.map(k => m[k]);
    }
  }
  throw new Error('no frame');
}
let _rots = null;
function allRotations() {
  if (_rots) return _rots;
  const seqs = [];
  const firsts = [[], [{ base: 'x', amount: 1 }], [{ base: 'x', amount: 2 }], [{ base: 'x', amount: 3 }],
    [{ base: 'z', amount: 1 }], [{ base: 'z', amount: 3 }]];
  for (const f of firsts) for (let k = 0; k < 4; k++) {
    const s = f.slice(); if (k) s.push({ base: 'y', amount: k }); seqs.push(s);
  }
  _rots = seqs; return seqs;
}

function stateAfter(moves) { return frameState(applyMoves(solvedState(), moves)); }

const SOLVED_FRAMED = frameState(solvedState());

// slot indices
const SLOT_INFO = solvedState().map(s => ({ p: s.p, n: s.n }));
const F2L_SLOTS = SLOT_INFO.map((s, i) => s.p[1] <= 0 ? i : -1).filter(i => i >= 0);
const LL_SLOTS = SLOT_INFO.map((s, i) => s.p[1] === 1 ? i : -1).filter(i => i >= 0);
const U_FACE_SLOTS = SLOT_INFO.map((s, i) => s.n[1] === 1 ? i : -1).filter(i => i >= 0);

function f2lIntact(fs) { return F2L_SLOTS.every(i => fs[i] === SOLVED_FRAMED[i]); }

const U = k => (k ? [{ base: 'U', amount: k }] : []);

// does `moves` (solution) solve the case produced by `caseSetup` (moves), up to AUF?
// kind 'oll' compares orientation only; 'pll' full state.
function solvesCase(kind, setupMoves, solMoves) {
  for (let a = 0; a < 4; a++) {
    const fs = stateAfter([...setupMoves, ...U(a), ...solMoves]);
    if (!f2lIntact(fs)) continue;
    if (kind === 'oll') {
      if (U_FACE_SLOTS.every(i => fs[i] === 'U')) return true;
    } else {
      for (let b = 0; b < 4; b++) {
        const f2 = stateAfter([...setupMoves, ...U(a), ...solMoves, ...U(b)]);
        if (f2.every((c, i) => c === SOLVED_FRAMED[i])) return true;
      }
    }
  }
  return false;
}

// top-layer description for thumbnails: returns {u:[9 colours row-major from back-left], sides:{B:[3],R:[3],F:[3],L:[3]}}
function topView(fs) {
  const get = (p, n) => fs[SLOT_ORDER.indexOf(key(p, n))];
  const u = [];
  for (let z = -1; z <= 1; z++) for (let x = -1; x <= 1; x++) u.push(get([x, 1, z], [0, 1, 0]));
  return {
    u,
    B: [-1, 0, 1].map(x => get([x, 1, -1], [0, 0, -1])),
    F: [-1, 0, 1].map(x => get([x, 1, 1], [0, 0, 1])),
    L: [-1, 0, 1].map(z => get([-1, 1, z], [-1, 0, 0])),
    R: [-1, 0, 1].map(z => get([1, 1, z], [1, 0, 0]))
  };
}

if (typeof module !== 'undefined') module.exports = {
  parseAlg, invertAlg, invertMoves, movesToString, moveToString, moveTurns, BASE,
  solvedState, applyMoves, stateAfter, f2lIntact, solvesCase, topView, SOLVED_FRAMED, U_FACE_SLOTS, U
};

// src: 'y' = Yiheng Wang (PLL: his GAN tutorial video), 'u' = your OLL sheet, 'm' = saved by you, 's' = standard
/*ALGS_START*/
const OLL_CASES = [
 [1,"Dot","R U2' R2' F R F' U2' R' F R F'","u",[]],

// Unfolded view from above: top face in the middle, the four sides folded out around it.

function f2lNetSVG(moves, slot, pal, grey) {
  pal = pal || DRAW_HEX; grey = grey || DRAW_GREY;
  const st = applyMoves(solvedState(), moves), at = {}, byPos = {};
  for (const s of st) { at[s.p + '|' + s.n] = s.c; (byPos[s.p] = byPos[s.p] || []).push(s.c); }
  const solvedSets = {}; for (const s of solvedState()) (solvedSets[s.p] = solvedSets[s.p] || []).push(s.c);
  const target = F2L_SLOT_HOME[slot].map(h => solvedSets[h].slice().sort().join(''));
  const col = (p, n) => {
    const c = at[p + '|' + n];
    if (p.filter(v => v !== 0).length === 1) return pal[c];
    return target.includes(byPos[p].slice().sort().join('')) ? pal[c] : grey;
  };
  const S = 13, C = 14.5, O = 3 * C + 6, out = [];
  const r = (x, y, f) => out.push(`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${S}" height="${S}" rx="2.4" fill="${f}" stroke="#141820" stroke-width="1.2"/>`);
  for (let x = -1; x <= 1; x++) for (let z = -1; z <= 1; z++) r(O + (x + 1) * C, O + (z + 1) * C, col([x, 1, z], [0, 1, 0]));
  for (let a = -1; a <= 1; a++) for (let y = 1; y >= -1; y--) {
    const k = 1 - y; // 0 = row next to the top face
    r(O + (a + 1) * C, O + 3 * C + 3 + k * C, col([a, y, 1], [0, 0, 1]));        // front (below)
    r(O + (a + 1) * C, O - 3 - (k + 1) * C, col([a, y, -1], [0, 0, -1]));        // back (above)
    r(O - 3 - (k + 1) * C, O + (a + 1) * C, col([-1, y, a], [-1, 0, 0]));        // left
    r(O + 3 * C + 3 + k * C, O + (a + 1) * C, col([1, y, a], [1, 0, 0]));        // right

  const size = 2 * O + 3 * C;
  // mark the target slot with a small corner bracket
  const [cx, , cz] = F2L_SLOT_HOME[slot][0];

  out.push(`<path d="M${mx + dx} ${my} L${mx} ${my} L${mx} ${my + dy}" fill="none" stroke="#3D7BFF" stroke-width="3" stroke-linecap="round"/>`);
  return { svg: out.join(''), size };
}

    out += r(O + i * (S + G) + 1, 3, S, 10, col(g([a, 1, -1], [0, 0, -1])));
    out += r(O + i * (S + G) + 1, 107, S, 10, col(g([a, 1, 1], [0, 0, 1])));
    out += r(3, O + i * (S + G) + 1, 10, S, col(g([-1, 1, a], [-1, 0, 0])));
    out += r(107, O + i * (S + G) + 1, 10, S, col(g([1, 1, a], [1, 0, 0])));
  }
  return out;
}

</script>
<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const store = { get(k, d){ try { const v = localStorage.getItem('lld.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v){ try { localStorage.setItem('lld.' + k, JSON.stringify(v)); } catch (e) {} } };
const custom = Object.assign({ oll:{}, pll:{}, f2l:{} }, store.get('custom', {}));
const ui = Object.assign({ set:'f2l', slot:'all' }, store.get('sheet', {}));
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[ch]));
const SRC = { y:'Yiheng', u:'your sheet', m:'yours', s:'standard' };
const SLOT_NAME = { FR:'front right', FL:'front left', BL:'back left', BR:'back right' };
const hash = location.hash.slice(1); if (['f2l','oll','pll'].includes(hash)) ui.set = hash;

function llCards(kind){
  const list = kind === 'oll' ? OLL_CASES : PLL_CASES;
  const groups = [];
  for (const [id, group, alg, src, alts] of list){
    let g = groups.find(x => x.name === group); if (!g) groups.push(g = { name: group, items: [] });
    const mine = custom[kind][String(id)];
    const all = [[alg, src], ...(alts || [])];
    const primary = mine || alg, psrc = mine ? (all.find(a => a[0] === mine) || [0, 'm'])[1] : src;
    const others = all.filter(a => a[0] !== primary);
    const svg = llThumbSVG(kind, invertMoves(parseAlg(primary).moves));
    const title = kind === 'oll' ? 'OLL ' + id : id + ' perm';
    g.items.push(`<article class="card"><div class="head"><svg viewBox="0 0 120 120" aria-hidden="true">${svg}</svg><div><div class="name">${esc(title)}</div><div class="sub">${esc(group)}</div></div></div>
      <div class="alg">${esc(primary)}<span class="tag">${esc(SRC[psrc] || 'standard')}</span></div>
      ${others.length ? `<details ${others.some(a => a[2]) ? 'open' : ''}><summary>${others.length} more alg${others.length > 1 ? 's' : ''}</summary>${others.map(a => `<div class="alg">${esc(a[0])}<span class="tag">${esc((SRC[a[1]] || 'standard') + (a[2] ? ' · ' + a[2] : ''))}</span></div>`).join('')}</details>` : ''}
      <a class="practise" href="index.html#${kind}-${encodeURIComponent(id)}">Practise in the trainer</a></article>`);
  }
  return groups;
}
function f2lCards(){
  const groups = [], slots = ui.slot === 'all' ? ['FL', 'FR', 'BL', 'BR'] : [ui.slot];
  const picSlot = ui.slot === 'all' ? 'FR' : ui.slot;
  for (const c of F2L_CASES){
    let g = groups.find(x => x.name === c.group); if (!g) groups.push(g = { name: c.group, items: [] });
    const net = f2lNetSVG(parseAlg(c.slots[picSlot].setup).moves, picSlot);
    const rows = slots.map(s => {
      const mine = custom.f2l[c.n + '-' + s], algs = c.slots[s].algs;
      const primary = mine || algs[0].alg, used = algs.find(a => a.alg === primary);
      const others = algs.filter(a => a.alg !== primary);
      return `<div class="row"><span class="slot">${s}</span><div><div class="alg">${esc(primary)}<span class="tag">${esc(mine && !used ? 'Yours' : used.tag)}</span></div>
        ${others.length ? `<details><summary>${others.length} more</summary>${others.map(a => `<div class="alg">${esc(a.alg)}<span class="tag">${esc(a.tag)}</span></div>`).join('')}</details>` : ''}</div></div>`;
    }).join('');
    g.items.push(`<article class="card"><div class="head"><svg viewBox="0 0 ${net.size} ${net.size}" aria-hidden="true">${net.svg}</svg><div><div class="name">F2L ${c.n}</div><div class="sub">${esc(c.group)}<br>Picture: ${SLOT_NAME[picSlot]} slot, seen from above</div></div></div>
      ${rows}<a class="practise" href="index.html#f2l-${c.n}-${picSlot}">Practise in the trainer</a></article>`);
  }
  return groups;
}
function render(){
  document.querySelectorAll('[data-set]').forEach(b => b.setAttribute('aria-pressed', b.dataset.set === ui.set));
  document.querySelectorAll('[data-slot]').forEach(b => b.setAttribute('aria-pressed', b.dataset.slot === ui.slot));
  $('slotSeg').hidden = ui.set !== 'f2l';
  const intro = ui.set === 'f2l'
    ? 'All 41 F2L cases for every slot, with no cube rotations. Pictures are from above: the top face in the middle with the four sides folded out, and the blue bracket marks the slot. Each slot lists the fastest alg first, ranked by how fast it is to turn, not only by move count: F, B, D and double turns count as slower, and a y rotation counts as about two easy moves. Where a rotation wins, the best rotation-free alg is listed too. “R and U only” or “L and U only” are one-hand versions. White cross on the bottom, green in front.'
    : ui.set === 'oll' ? 'All 57 OLL cases with the algs from your sheet. Your saved algs from the trainer show first.'
    : 'All 21 PLL cases with Yiheng Wang’s algs from his tutorial video. Your saved algs from the trainer show first.';
  const groups = ui.set === 'f2l' ? f2lCards() : llCards(ui.set);
  $('main').innerHTML = `<p class="intro">${intro}</p>` + groups.map(g => `<h2 class="group">${esc(g.name)}</h2><div class="grid">${g.items.join('')}</div>`).join('');
  store.set('sheet', ui);
}
document.querySelectorAll('[data-set]').forEach(b => b.onclick = () => { ui.set = b.dataset.set; render(); });
document.querySelectorAll('[data-slot]').forEach(b => b.onclick = () => { ui.slot = b.dataset.slot; render(); });
render();
})();
</script>
